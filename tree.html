<!DOCTYPE html>
<html lang="ru">
<head>

<title>Бинарное Дерево</title>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
mermaid.initialize({startOnLoad:true, flowchart:{useMaxWidth:false, curve:'linear', nodeSpacing:30, rankSpacing:30}});
</script>
<style>
body { display: flex; flex-wrap: wrap; gap: 20px; background: #212121; color: white; }
.tree { display: flex; flex-direction: column; background: #333; padding: 10px; border-radius: 10px; width: min-content; height: min-content; }
.mermaid svg path {  stroke: white !important; }
.mermaid .node rect { fill: #212121 !important; stroke: white !important; }
.mermaid .nodeLabel { color: white !important; }
span { text-align: center; margin-bottom: 5px; }
</style>
</head>
<body>

</div>

</html>
